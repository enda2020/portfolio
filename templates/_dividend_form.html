<div class="mb-3">
    <label for="payment_date" class="form-label">Payment Date</label>
    <input type="date" class="form-control" id="payment_date" name="payment_date" value="{{ values.payment_date or today }}" required>
</div>
<div class="mb-3">
    <label for="symbol" class="form-label">Symbol</label>
    <input type="text" class="form-control" id="symbol" name="symbol" value="{{ values.symbol or '' }}" required>
</div>
<div class="mb-3">
    <label for="name" class="form-label">Company / Fund Name</label>
    <input type="text" class="form-control" id="name" name="name" value="{{ values.name or '' }}" required>
</div>
<div class="row">
    <div class="col-md-6 mb-3">
        <label for="quantity" class="form-label">Shares</label>
        <input type="number" step="any" class="form-control" id="quantity" name="quantity" value="{{ values.quantity or '' }}">
    </div>
    <div class="col-md-6 mb-3">
        <label for="amount_per_share" class="form-label">Amount per Share</label>
        <input type="number" step="any" class="form-control" id="amount_per_share" name="amount_per_share" value="{{ values.amount_per_share or '' }}">
    </div>
</div>
<div class="row">
    <div class="col-md-6 mb-3">
        <label for="gross_amount" class="form-label">Gross Amount</label>
        <input type="number" step="any" class="form-control" id="gross_amount" name="gross_amount" value="{{ values.gross_amount or '' }}">
    </div>
    <div class="col-md-6 mb-3">
        <label for="deductible_interest" class="form-label">Deductible Interest</label>
        <input type="number" step="any" class="form-control" id="deductible_interest" name="deductible_interest" value="{{ values.deductible_interest or '' }}">
    </div>
</div>
<div class="row">
    <div class="col-md-6 mb-3">
        <label for="foreign_tax_withheld" class="form-label">Foreign Tax Withheld</label>
        <input type="number" step="any" class="form-control" id="foreign_tax_withheld" name="foreign_tax_withheld" value="{{ values.foreign_tax_withheld or '' }}">
    </div>
    <div class="col-md-6 mb-3">
        <label for="japanese_income_tax_withheld" class="form-label">Japan Income Tax Withheld</label>
        <input type="number" step="any" class="form-control" id="japanese_income_tax_withheld" name="japanese_income_tax_withheld" value="{{ values.japanese_income_tax_withheld or '' }}">
    </div>
</div>
<div class="row">
    <div class="col-md-6 mb-3">
        <label for="japanese_local_tax_withheld" class="form-label">Japan Local Tax Withheld</label>
        <input type="number" step="any" class="form-control" id="japanese_local_tax_withheld" name="japanese_local_tax_withheld" value="{{ values.japanese_local_tax_withheld or '' }}">
    </div>
    <div class="col-md-6 mb-3">
        <label for="tax_withheld" class="form-label">Other Tax Withheld</label>
        <input type="number" step="any" class="form-control" id="tax_withheld" name="tax_withheld" value="{{ values.tax_withheld or '' }}">
    </div>
</div>
<div class="row">
    <div class="col-md-4 mb-3">
        <label for="source_country" class="form-label">Source Country</label>
        <input type="text" class="form-control" id="source_country" name="source_country" value="{{ values.source_country or '' }}" placeholder="US">
    </div>
    <div class="col-md-4 mb-3">
        <label for="security_type" class="form-label">Security Type</label>
        <select class="form-select" id="security_type" name="security_type">
            <option value="listed_stock" {% if values.security_type in [none, '', 'listed_stock'] %}selected{% endif %}>Listed Stock</option>
            <option value="etf" {% if values.security_type == 'etf' %}selected{% endif %}>ETF</option>
            <option value="mutual_fund" {% if values.security_type == 'mutual_fund' %}selected{% endif %}>Mutual Fund</option>
            <option value="other" {% if values.security_type == 'other' %}selected{% endif %}>Other</option>
        </select>
    </div>
    <div class="col-md-4 mb-3">
        <label for="tax_treatment" class="form-label">Filing Treatment</label>
        <select class="form-select" id="tax_treatment" name="tax_treatment">
            <option value="undecided" {% if values.tax_treatment in [none, '', 'undecided'] %}selected{% endif %}>Undecided</option>
            <option value="not_filed" {% if values.tax_treatment == 'not_filed' %}selected{% endif %}>No Filing</option>
            <option value="aggregate" {% if values.tax_treatment == 'aggregate' %}selected{% endif %}>Aggregate</option>
            <option value="separate" {% if values.tax_treatment == 'separate' %}selected{% endif %}>Separate</option>
        </select>
    </div>
</div>
<div class="mb-3">
    <label for="currency" class="form-label">Currency</label>
    <select class="form-select" id="currency" name="currency" required>
        <option value="USD" {% if values.currency == 'USD' %}selected{% endif %}>USD</option>
        <option value="JPY" {% if values.currency == 'JPY' %}selected{% endif %}>JPY</option>
    </select>
</div>
<div class="mb-3">
    <label for="broker" class="form-label">Broker</label>
    <select class="form-select" id="broker" name="broker" required>
        {% for broker in brokers %}
        <option value="{{ broker }}" {% if values.broker == broker %}selected{% endif %}>{{ broker }}</option>
        {% endfor %}
    </select>
</div>
<div class="row">
    <div class="col-md-6 mb-3">
        <label for="account_name" class="form-label">Account Name</label>
        <select class="form-select" id="account_name" name="account_name" required>
            {% for account_name in account_names %}
            <option value="{{ account_name }}" {% if values.account_name == account_name %}selected{% endif %}>{{ account_name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-6 mb-3">
        <label for="tax_status" class="form-label">Tax Status</label>
        <select class="form-select" id="tax_status" name="tax_status" required>
            {% for tax_status in tax_statuses %}
            <option value="{{ tax_status }}" {% if values.tax_status == tax_status %}selected{% endif %}>{{ tax_status }}</option>
            {% endfor %}
        </select>
    </div>
</div>
<div class="mb-3">
    <label for="fx_rate" class="form-label">FX Rate</label>
    <div class="input-group">
        <input type="number" step="any" class="form-control" id="fx_rate" name="fx_rate" value="{{ values.fx_rate or '' }}">
        <button class="btn btn-outline-info" type="button" id="fetch_fx_btn" onclick="fetchFXRateDividend()">Auto-Fetch</button>
    </div>
    <div class="form-text">For USD dividends, enter the payment-date USD/JPY rate to calculate JPY totals. Click "Auto-Fetch" to get the rate from MURC (uses TTS).</div>
</div>
<div class="mb-3">
    <label for="notes" class="form-label">Notes</label>
    <textarea class="form-control" id="notes" name="notes" rows="3">{{ values.notes or '' }}</textarea>
</div>
