{% extends "base.html" %}

{% block title %}Edit Mutual Fund Transaction{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-7 offset-md-2">
        <div class="card">
            <div class="card-header">
                <h3 class="mb-0">Edit Mutual Fund Transaction</h3>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('edit_mutual_fund_trade', trade_id=trade_id) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <div class="mb-3">
                        <label for="fund_name" class="form-label">Fund Name</label>
                        <input type="text" class="form-control" id="fund_name" name="fund_name" value="{{ values.fund_name or '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="fund_code" class="form-label">Fund Code</label>
                        <input type="text" class="form-control" id="fund_code" name="fund_code" value="{{ values.fund_code or '' }}" required>
                        <div class="form-text">Use the Yahoo JP fund code, such as 0331418A. JP90C000H1T1 is also recognized.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Transaction Type</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="transaction_type" id="fund_buy" value="BUY" {% if values.transaction_type != 'SELL' %}checked{% endif %}>
                            <label class="form-check-label" for="fund_buy">Buy</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="transaction_type" id="fund_sell" value="SELL" {% if values.transaction_type == 'SELL' %}checked{% endif %}>
                            <label class="form-check-label" for="fund_sell">Sell</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="executed_units" class="form-label">Executed Units</label>
                            <input type="number" step="any" class="form-control" id="executed_units" name="executed_units" value="{{ values.executed_units or '' }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="nav_per_10000" class="form-label">NAV per 10,000 Units</label>
                            <input type="number" step="any" class="form-control" id="nav_per_10000" name="nav_per_10000" value="{{ values.nav_per_10000 or '' }}" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="trade_date" class="form-label">Trade Date</label>
                            <input type="date" class="form-control" id="trade_date" name="trade_date" value="{{ values.trade_date or today }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="broker" class="form-label">Broker</label>
                            <select class="form-select" id="broker" name="broker" required>
                                {% for broker in brokers %}
                                <option value="{{ broker }}" {% if values.broker == broker %}selected{% endif %}>{{ broker }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="account_name" class="form-label">Account Name</label>
                            <select class="form-select" id="account_name" name="account_name" required>
                                {% for account_name in account_names %}
                                <option value="{{ account_name }}" {% if values.account_name == account_name %}selected{% endif %}>{{ account_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="tax_status" class="form-label">Tax Status</label>
                            <select class="form-select" id="tax_status" name="tax_status" required>
                                {% for tax_status in tax_statuses %}
                                <option value="{{ tax_status }}" {% if values.tax_status == tax_status %}selected{% endif %}>{{ tax_status }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Update Mutual Fund Transaction</button>
                    <a href="{{ url_for('list_mutual_fund_trades') }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
