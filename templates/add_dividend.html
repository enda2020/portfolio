{% extends "base.html" %}

{% block title %}Add Dividend{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3">
        <div class="card">
            <div class="card-header">
                <h3 class="mb-0">Add Dividend</h3>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('add_dividend') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    {% include "_dividend_form.html" %}
                    <button type="submit" class="btn btn-primary">Save Dividend</button>
                    <a href="{{ url_for('list_dividends') }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
