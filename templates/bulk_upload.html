{% extends "base.html" %}

{% block title %}Import CSV{% endblock %}

{% block content %}
<div class="page-toolbar d-flex justify-content-between align-items-center mb-4">
    <h1>Import CSV</h1>
    <div class="page-actions">
        <a href="{{ url_for('import_profiles') }}" class="btn btn-outline-info">Import Profiles</a>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <h3 class="mb-0">Upload with Profiles</h3>
    </div>
    <div class="card-body">
        <form method="post" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="mb-3">
                <label for="file" class="form-label">CSV File</label>
                <input class="form-control" type="file" id="file" name="file" accept=".csv" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Profiles</label>
                {% if profiles %}
                    <div class="import-profile-picker">
                        {% for profile in profiles %}
                        <label class="import-profile-option">
                            <input class="form-check-input" type="checkbox" name="profile_ids" value="{{ profile.id }}">
                            <span>
                                <strong>{{ profile.name }}</strong>
                                <small>{{ profile.instrument_type|replace('_', ' ')|title }} · {{ profile.encoding }} · header row {{ profile.header_row }}</small>
                            </span>
                        </label>
                        {% endfor %}
                    </div>
                {% else %}
                    <div class="text-muted">No import profiles have been created yet.</div>
                {% endif %}
            </div>
            <button type="submit" class="btn btn-primary" {% if not profiles %}disabled{% endif %}>Upload and Import</button>
        </form>
    </div>
</div>
{% endblock %}
